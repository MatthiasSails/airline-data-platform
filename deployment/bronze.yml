# airline-etl-bronze stack — fetches OpenSky + adsb.lol snapshots into MongoDB.
#
# Rate-limited by upstream APIs — see docs/data-sources/. OpenSky: 4,000 credits/day on the
# Registered tier, 2 credits per states/all call, but unreachable from this AWS VM (the range
# is network-filtered), hence OPENSKY_ENABLED below. adsb.lol: a hard 500 requests/day per
# client IP, so the loop cannot run faster than one call every ~173s — it is set to 170s and
# is independent of silver's refresh cadence.
#
# Image is built and pushed to GHCR by ../.github/workflows/build-push.yml on every push to
# main that touches etl/ or deployment/Dockerfile — Portainer only pulls, it doesn't build.
# Same image as silver.yml (identical Dockerfile/context); only the command differs.
#
# Env is injected by Portainer per stack ("Environment variables" field), not from the repo
# .env — that file is gitignored and absent in the GitOps clone, so an env_file: reference
# would fail the deploy outright.
services:
  bronze:
    image: ghcr.io/matthiassails/airline-etl:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: etl_bronze
    environment:
      - OPENSKY_CLIENT_ID=${OPENSKY_CLIENT_ID}
      - OPENSKY_CLIENT_SECRET=${OPENSKY_CLIENT_SECRET}
      - MONGO_URL=${MONGO_URL}
      # false skips the OpenSky fetch entirely (and with it the token request, so the
      # two OPENSKY_* values above become optional). Set it on hosts that cannot reach
      # opensky-network.org — which is every AWS host today.
      - OPENSKY_ENABLED=${OPENSKY_ENABLED:-true}
      # Bounded by adsb.lol's 500 requests/day per IP; see etl/run_bronze.sh.
      - BRONZE_SLEEP_SECONDS=${BRONZE_SLEEP_SECONDS:-170}
    command: bash run_bronze.sh
    restart: unless-stopped
    logging:
      driver: local
    # The window must exceed one full cycle (BRONZE_SLEEP_SECONDS plus a run) or the
    # container reports unhealthy while working perfectly. 400s tolerates the 170s
    # cadence plus one entirely missed cycle; raise it alongside the sleep value.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(stat -c %Y heartbeat 2>/dev/null || echo 0) )) -lt 400"]
      interval: 60s
      timeout: 5s
      start_period: 60s
      retries: 3
